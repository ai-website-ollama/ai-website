<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up disabled - Zig</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <svg class="claude-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="currentColor"/>
                    <path d="M12 6C8.69 6 6 8.69 6 12H8C8 9.79 9.79 8 12 8V6Z" fill="currentColor"/>
                </svg>
            </div>
            
            <h1>Sign up is disabled</h1>
            <p class="auth-subtitle">An admin account can create users from the API/admin tools.</p>
            
            <button class="btn btn-primary btn-full" onclick="window.location.href='/login'">
                Go to sign in
            </button>
        </div>
        
        <div class="auth-footer">
            <p>By signing up, you agree to our Terms & Privacy Policy</p>
        </div>
    </div>
    
</body>
</html>
